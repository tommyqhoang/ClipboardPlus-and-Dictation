name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            spec: packaging/linux/clipboardplus.spec
            wrap: packaging/linux/build-appimage.sh
            asset: dist/Clipboard+-x86_64.AppImage
          - os: macos-latest
            spec: packaging/macos/clipboardplus.spec
            wrap: packaging/macos/build-dmg.sh
            asset: dist/Clipboard+.dmg
          - os: windows-latest
            spec: packaging/windows/clipboardplus.spec
            wrap: ""
            asset: dist/Clipboard+-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      # The tray/menu-bar entry point needs the same GUI toolkit setup-desktop.py
      # installs into its private venv for a source install — PyInstaller can
      # only bundle what's actually importable while it analyzes the code.
      - name: Install GUI runtime deps (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install "pyobjc-framework-Cocoa==12.2.2" "Pillow==12.3.0"
      - name: Install GUI runtime deps (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install "pystray==0.19.5" "Pillow==12.3.0" "python-xlib==0.33"
      - name: Install GUI runtime deps (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install "pystray==0.19.5" "Pillow==12.3.0"
      - run: pyinstaller ${{ matrix.spec }}
      - name: Smoke-launch every bundled entry point
        shell: bash
        run: |
          set -e
          fail=0
          for exe in dist/clipboardplus/*; do
            [ -f "$exe" ] && [ -x "$exe" ] || continue
            name="$(basename "$exe")"
            log="/tmp/smoke-$name.log"
            case "$name" in
              dictation) timeout 5 "$exe" --status >"$log" 2>&1; code=$? ;;
              *) timeout 5 "$exe" >"$log" 2>&1; code=$? ;;
            esac
            # 124 = still running after the timeout (a GUI entry point that
            # started its run loop) — that's success, not a hang to report.
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 2 ]; then
              if grep -qE "Traceback \(most recent call last\)|ModuleNotFoundError|ImportError" "$log"; then
                echo "SMOKE TEST FAILED: $name crashed on import (exit $code)"
                cat "$log"
                fail=1
                continue
              fi
            fi
            echo "OK: $name (exit $code)"
          done
          [ "$fail" -eq 0 ]
      - name: Wrap (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          bash ${{ matrix.wrap }}
      - name: Wrap (macOS)
        if: runner.os == 'macOS'
        run: bash ${{ matrix.wrap }}
      - name: Wrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          $version = python -c "import sys; sys.path.insert(0, 'lib'); import desktop; print(desktop.APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\clipboardplus.iss
      - name: Checksum
        shell: bash
        # shasum (not sha256sum) is the one checksum tool present by default on
        # macOS, Linux, and Windows Git Bash alike; sha256sum is GNU/Linux-only.
        run: shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
