name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
  DICTATION_TELEMETRY: '0'
jobs:
  checks:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt python3-tk xvfb xauth libtk8.6
        if: runner.os == 'Linux'
      - run: ruff check lib tests tools setup-desktop.py && ruff format --check lib tests tools setup-desktop.py
      - run: mypy --strict lib tools setup-desktop.py
      - run: shellcheck bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh tests/verify-install.sh
        if: runner.os == 'Linux'
      - run: shfmt -d -i 2 -ci bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh tests/verify-install.sh
        if: runner.os == 'Linux'
      - name: Parse Windows bootstrap without installing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/bootstrap.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - run: sh tests/with-xvfb.sh sh -c 'coverage run -m unittest discover -s tests -v && coverage combine && coverage report'
        if: runner.os == 'Linux'
      - run: coverage run -m unittest discover -s tests -v && coverage combine && coverage report
        if: runner.os != 'Linux'
      - run: python -m compileall -q lib setup-desktop.py

  python-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q lib setup-desktop.py

  linux-distro-install:
    # The installer must bring a bare system to a working install, whatever the distribution.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:latest, debian:stable, fedora:latest, archlinux:latest, opensuse/tumbleweed:latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/verify-install.sh
