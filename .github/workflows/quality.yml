name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml gates a release on these same checks.
permissions:
  contents: read
# A newer push replaces the run still going for the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DO_NOT_TRACK: '1'
  DICTATION_TELEMETRY: '0'
jobs:
  checks:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt python3-tk xvfb xauth libtk8.6
        if: runner.os == 'Linux'
      - run: ruff check lib tests tools packaging/checksum.py packaging/smoke_release.py setup-desktop.py && ruff format --check lib tests tools packaging/checksum.py packaging/smoke_release.py setup-desktop.py
      - run: mypy --strict lib tools packaging/checksum.py packaging/smoke_release.py setup-desktop.py
      - run: shellcheck bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh tests/verify-install.sh packaging/linux/build-appimage.sh packaging/linux/uninstall-appimage.sh packaging/linux/AppDir/AppRun packaging/macos/build-dmg.sh packaging/macos/uninstall.command
        if: runner.os == 'Linux'
      - run: shfmt -d -i 2 -ci bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh tests/verify-install.sh packaging/linux/build-appimage.sh packaging/linux/uninstall-appimage.sh packaging/linux/AppDir/AppRun packaging/macos/build-dmg.sh packaging/macos/uninstall.command
        if: runner.os == 'Linux'
      - name: Parse Windows scripts without running them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('bootstrap.ps1', 'uninstall.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/$script", [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      # GUI pins live in requirements-gui.txt only (release.yml uses it too).
      - run: python -m pip install -r requirements-gui.txt
      - run: sh tests/with-xvfb.sh sh -c 'coverage run -m unittest discover -s tests -v && coverage combine && coverage report'
        if: runner.os == 'Linux'
      # The coverage floor is held on Linux, where every test runs; here Linux-only
      # tests are skipped, so a lower floor guards against a platform silently
      # running almost nothing.
      - run: coverage run -m unittest discover -s tests -v && coverage combine && coverage report --fail-under=50
        if: runner.os != 'Linux'
      - run: python -m compileall -q lib setup-desktop.py

  python-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q lib setup-desktop.py

  linux-distro-install:
    # The installer must bring a bare system to a working install, whatever the distribution.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:latest, debian:stable, fedora:latest, archlinux:latest, opensuse/tumbleweed:latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/verify-install.sh

  dependency-audit:
    # Known-vulnerability scan of every pinned requirement the app and the
    # release builds install.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit -r requirements-release.txt
