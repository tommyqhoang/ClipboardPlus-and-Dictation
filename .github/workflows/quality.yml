name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt python3-tk xvfb xauth libtk8.6
        if: runner.os == 'Linux'
      - run: ruff check lib tests setup-desktop.py && ruff format --check lib tests setup-desktop.py
      - run: mypy --strict lib setup-desktop.py
      - run: shellcheck bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh
        if: runner.os == 'Linux'
      - run: shfmt -d -i 2 -ci bin/dictate-toggle bootstrap.sh install.sh uninstall.sh tests/check.sh tests/with-xvfb.sh
        if: runner.os == 'Linux'
      - name: Parse Windows bootstrap without installing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/bootstrap.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - run: sh tests/with-xvfb.sh sh -c 'coverage run -m unittest discover -s tests -v && coverage combine && coverage report'
        if: runner.os == 'Linux'
      - run: coverage run -m unittest discover -s tests -v && coverage combine && coverage report
        if: runner.os != 'Linux'
      - run: python -m compileall -q lib setup-desktop.py
