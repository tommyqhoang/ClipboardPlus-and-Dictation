[project]
name = "clipboardplus"
# Kept equal to lib/desktop.py APP_VERSION; tests/test_packaging.py enforces it.
version = "1.4.3"
description = "Clipboard+ and Dictation: local clipboard history and on-device voice dictation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Tommy Hoang" }]
# The core runs on the standard library alone; GUI toolkits are pinned in
# requirements-gui.txt.
dependencies = []

[project.urls]
Homepage = "https://github.com/tommyqhoang/ClipboardPlus-and-Dictation"
Issues = "https://github.com/tommyqhoang/ClipboardPlus-and-Dictation/issues"
Changelog = "https://github.com/tommyqhoang/ClipboardPlus-and-Dictation/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lib", "setup-desktop.py"]

[[tool.mypy.overrides]]
# PyObjC ships without type information; its decorators are untyped.
module = "menubar"
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
# PyGObject is a system package (python3-gi): present on some machines and CI images and
# not others, and untyped where present, so it must never change the result.
module = ["gi", "gi.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.coverage.run]
branch = true
source = ["lib"]
# The AppKit layer needs a macOS GUI session and PyObjC; its logic lives in hotkeys.py.
omit = ["lib/menubar.py"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
