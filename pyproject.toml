[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lib", "setup-desktop.py"]

[tool.coverage.run]
branch = true
source = ["lib"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
