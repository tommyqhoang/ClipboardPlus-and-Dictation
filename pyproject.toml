[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lib", "setup-desktop.py"]

[[tool.mypy.overrides]]
# PyObjC ships without type information; its decorators are untyped.
module = "menubar"
disable_error_code = ["untyped-decorator"]

[tool.coverage.run]
branch = true
source = ["lib"]
# The AppKit layer needs a macOS GUI session and PyObjC; its logic lives in hotkeys.py.
omit = ["lib/menubar.py"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
